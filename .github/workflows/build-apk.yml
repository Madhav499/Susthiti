name: Build and Publish SUSTHITI APK

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "scripts/build-release.bat"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

# deploy/web/** is intentionally NOT in the paths filter above, and the commit
# this workflow makes carries [skip ci], so the APK commit/push below can
# never re-trigger this workflow (no infinite loop).
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app/android/gradle/wrapper/gradle-wrapper.properties', 'app/android/**/*.gradle*') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('app/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Diagnostics
        shell: bash
        run: |
          echo "--- java -version ---"
          java -version
          echo "--- flutter --version ---"
          flutter --version

      - name: Restore Android signing keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/android/app/susthiti-release.jks

          if [ ! -s app/android/app/susthiti-release.jks ]; then
            echo "::error::Keystore file was not created or is empty. Check ANDROID_KEYSTORE_BASE64 secret."
            exit 1
          fi
          echo "Keystore present: $(ls -la app/android/app/susthiti-release.jks)"

      - name: Create key.properties
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          cat > app/android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=susthiti-release.jks
          EOF

          if [ ! -s app/android/key.properties ]; then
            echo "::error::key.properties was not created."
            exit 1
          fi
          echo "key.properties present (values redacted):"
          sed 's/=.*/=***REDACTED***/' app/android/key.properties

      - name: Verify keystore signing configuration
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keytool -list -v \
            -keystore app/android/app/susthiti-release.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" > /dev/null
          echo "Keystore is valid and alias '$KEY_ALIAS' was found."

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Build signed release APK
        working-directory: app
        timeout-minutes: 15
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=https://susthiti.onrender.com/api/v1

      - name: Publish APK to download website
        shell: bash
        run: |
          cp app/build/app/outputs/flutter-apk/app-release.apk deploy/web/SUSTHITI.apk

      - name: Commit updated APK
        shell: bash
        run: |
          git config user.name "Madhav499"
          git config user.email "madhavpatoliya763@gmail.com"

          git add deploy/web/SUSTHITI.apk

          if git diff --cached --quiet; then
            echo "No APK changes to commit."
            exit 0
          fi

          git commit -m "chore: update SUSTHITI APK [skip ci]"

      - name: Push updated APK
        shell: bash
        run: |
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
